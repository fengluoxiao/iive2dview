name: iOS Native Live2D

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Build an enterprise-signed IPA
        required: true
        default: false
        type: boolean
  push:
    paths:
      - 'native-vue/**'
      - '.github/workflows/ios-native.yml'

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: native-vue
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native-vue/package-lock.json
      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
      - run: npm ci
      - name: Add NativeScript iOS runtime
        run: npx --yes --package=nativescript@9.1.1 ns platform add ios
      - name: Compile Cubism Metal shaders
        run: bash scripts/compile-cubism-metal.sh iphoneos
      - name: Prepare NativeScript iOS project
        run: |
          set -o pipefail
          if ! npx --yes --package=nativescript@9.1.1 ns prepare ios 2>&1 | tee nativescript-prepare.log; then
            if ! grep -iE 'error|failed|cannot|not found' nativescript-prepare.log | tail -n 25 > nativescript-prepare-errors.log; then
              tail -n 25 nativescript-prepare.log > nativescript-prepare-errors.log
            fi
            summary="$(tr '\n' ' ' < nativescript-prepare-errors.log)"
            printf '::error title=NativeScript iOS prepare::%s\n' "$summary"
            exit 1
          fi
      - name: Verify the Cubism Native dependency
        run: |
          test -f packages/live2d-native-metal/vendor/Cubism/Core/lib/ios/Release-iphoneos/libLive2DCubismCore.a
          test -f packages/live2d-native-metal/vendor/Cubism/Core/LICENSE.md
          test -f packages/live2d-native-metal/vendor/Cubism/Core/RedistributableFiles.txt
          test -f App_Resources/iOS/Res/Resources/back_class_normal.png
      - name: Install enterprise signing material
        if: ${{ inputs.sign == true }}
        env:
          IOS_ENTERPRISE_P12_BASE64: ${{ secrets.IOS_ENTERPRISE_P12_BASE64 }}
          IOS_ENTERPRISE_P12_PASSWORD: ${{ secrets.IOS_ENTERPRISE_P12_PASSWORD }}
          IOS_ENTERPRISE_PROFILE_BASE64: ${{ secrets.IOS_ENTERPRISE_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${IOS_BUNDLE_ID:?Set the IOS_BUNDLE_ID repository variable.}"
          : "${IOS_TEAM_ID:?Set the IOS_TEAM_ID repository variable.}"
          : "${IOS_SIGNING_IDENTITY:?Set the IOS_SIGNING_IDENTITY repository variable.}"
          : "${IOS_ENTERPRISE_P12_BASE64:?Set the IOS_ENTERPRISE_P12_BASE64 repository secret.}"
          : "${IOS_ENTERPRISE_P12_PASSWORD:?Set the IOS_ENTERPRISE_P12_PASSWORD repository secret.}"
          : "${IOS_ENTERPRISE_PROFILE_BASE64:?Set the IOS_ENTERPRISE_PROFILE_BASE64 repository secret.}"
          keychain="$RUNNER_TEMP/live2d-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert="$RUNNER_TEMP/enterprise.p12"
          profile="$RUNNER_TEMP/enterprise.mobileprovision"
          printf '%s' "$IOS_ENTERPRISE_P12_BASE64" | base64 --decode > "$cert"
          printf '%s' "$IOS_ENTERPRISE_PROFILE_BASE64" | base64 --decode > "$profile"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$IOS_ENTERPRISE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$IOS_SIGNING_IDENTITY"
          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          case "$profile_app_id" in *".${IOS_BUNDLE_ID}"|*".*") ;; *) echo "Provisioning profile does not cover ${IOS_BUNDLE_ID}"; exit 1 ;; esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          {
            echo "DEVELOPMENT_TEAM = ${IOS_TEAM_ID}"
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = ${IOS_SIGNING_IDENTITY}"
            echo "PROVISIONING_PROFILE = ${profile_uuid}"
          } >> App_Resources/iOS/build.xcconfig
      - name: Compile iPhone app without signing
        if: ${{ inputs.sign != true }}
        run: |
          set -uo pipefail
          find platforms/ios -maxdepth 3 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -type d -print | sort
          workspace="$(find platforms/ios -maxdepth 2 -name '*.xcworkspace' -type d -print -quit)"
          if [ -z "$workspace" ]; then
            echo '::error title=Unsigned iPhone build::NativeScript did not generate an iOS CocoaPods workspace.'
            exit 1
          fi

          # NativeScript's product name is not guaranteed to match its generated
          # xcodeproj name. Query the workspace instead of deriving a scheme path.
          xcodebuild -list -workspace "$workspace" | tee xcodebuild-schemes.log
          scheme="$(sed -n '/Schemes:/,$p' xcodebuild-schemes.log | sed -n 's/^[[:space:]]*//p' | grep -vE '^(Pods-|Schemes:|$)' | head -n 1)"
          if [ -z "$scheme" ]; then
            echo '::error title=Unsigned iPhone build::No application scheme was found in the generated iOS workspace.'
            exit 1
          fi
          echo "Building workspace=$workspace scheme=$scheme"

          set -o pipefail
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
          build_status="${PIPESTATUS[0]}"
          if [ "$build_status" -ne 0 ]; then
            {
              echo '--- relevant Xcode diagnostics ---'
              grep -inE 'error:|fatal error|undefined symbol|ld:|BUILD FAILED|codesign|provisioning' xcodebuild.log | tail -n 80 || true
              echo '--- last Xcode output ---'
              tail -n 160 xcodebuild.log
            } | tee xcodebuild-errors.log
            printf '::error title=Unsigned iPhone build::xcodebuild failed; see the relevant Xcode diagnostics emitted above and the diagnostics artifact.\n'
            exit "$build_status"
          fi
          # A workspace reports settings for the app plus every Pod target.
          # Keep TARGET_BUILD_DIR and WRAPPER_NAME from the same target block,
          # and accept only the block whose bundle name ends in .app.
          settings="$(xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -showBuildSettings)"
          app="$(printf '%s\n' "$settings" | awk '
            function emit_app() {
              if (wrapper_name ~ /\.app$/ && target_build_dir != "") {
                print target_build_dir "/" wrapper_name
                found = 1
                exit
              }
            }
            /^Build settings for action .* target / {
              emit_app()
              target_build_dir = ""
              wrapper_name = ""
              next
            }
            /^[[:space:]]*TARGET_BUILD_DIR = / {
              sub(/^[[:space:]]*TARGET_BUILD_DIR = /, "")
              target_build_dir = $0
              next
            }
            /^[[:space:]]*WRAPPER_NAME = / {
              sub(/^[[:space:]]*WRAPPER_NAME = /, "")
              wrapper_name = $0
              next
            }
            END { if (!found) emit_app() }
          ')"
          if [ -z "$app" ]; then
            printf '::error title=Unsigned iPhone build::Xcode did not report a target app output path\n'
            exit 1
          fi
          if [ ! -d "$app" ] || [ ! -f "$app/Info.plist" ]; then
            printf 'Xcode reported app path: %s\n' "$app"
            printf '::error title=Unsigned iPhone build::xcodebuild completed but its reported app bundle is invalid\n'
            exit 1
          fi
          mkdir -p artifacts/Payload
          cp -R "$app" artifacts/Payload/
          (cd artifacts && zip -qry live2d-native-unsigned.ipa Payload)
          ipa_contents="$(unzip -Z1 artifacts/live2d-native-unsigned.ipa)"
          if ! grep -qE '^Payload/[^/]+\.app/Info\.plist$' <<< "$ipa_contents"; then
            printf '%s\n' "$ipa_contents"
            printf '::error title=Unsigned iPhone build::IPA does not contain Payload/<app>.app/Info.plist\n'
            exit 1
          fi
      - name: Build enterprise-signed IPA
        if: ${{ inputs.sign == true }}
        run: npx --yes --package=nativescript@9.1.1 ns build ios --for-device --release --env.uglify
      - name: Upload IPA
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.sign == true && 'live2d-native-signed-ipa' || 'live2d-native-unsigned-ipa' }}
          path: ${{ inputs.sign == true && 'native-vue/platforms/ios/**/*.ipa' || 'native-vue/artifacts/live2d-native-unsigned.ipa' }}
          if-no-files-found: error
      - name: Upload build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: live2d-native-build-diagnostics
          path: native-vue/xcodebuild.log
          if-no-files-found: warn
