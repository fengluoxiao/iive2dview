name: iOS Native Live2D

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Build an enterprise-signed IPA
        required: true
        default: false
        type: boolean
  push:
    paths:
      - 'native-vue/**'
      - '.github/workflows/ios-native.yml'

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: native-vue
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native-vue/package-lock.json
      - run: npm ci
      - name: Prepare NativeScript iOS project
        run: npx --yes --package=nativescript@9.1.1 ns prepare ios
      - name: Verify the Cubism Native dependency
        run: |
          test -f vendor/CubismSdkForNative-5-r.5/CubismSdkForNative-5-r.5/Core/lib/ios/Release-iphoneos/libLive2DCubismCore.a
          test -f App_Resources/iOS/Res/Resources/back_class_normal.png
      - name: Install enterprise signing material
        if: ${{ inputs.sign == true }}
        env:
          IOS_ENTERPRISE_P12_BASE64: ${{ secrets.IOS_ENTERPRISE_P12_BASE64 }}
          IOS_ENTERPRISE_P12_PASSWORD: ${{ secrets.IOS_ENTERPRISE_P12_PASSWORD }}
          IOS_ENTERPRISE_PROFILE_BASE64: ${{ secrets.IOS_ENTERPRISE_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${IOS_BUNDLE_ID:?Set the IOS_BUNDLE_ID repository variable.}"
          : "${IOS_TEAM_ID:?Set the IOS_TEAM_ID repository variable.}"
          : "${IOS_SIGNING_IDENTITY:?Set the IOS_SIGNING_IDENTITY repository variable.}"
          : "${IOS_ENTERPRISE_P12_BASE64:?Set the IOS_ENTERPRISE_P12_BASE64 repository secret.}"
          : "${IOS_ENTERPRISE_P12_PASSWORD:?Set the IOS_ENTERPRISE_P12_PASSWORD repository secret.}"
          : "${IOS_ENTERPRISE_PROFILE_BASE64:?Set the IOS_ENTERPRISE_PROFILE_BASE64 repository secret.}"
          keychain="$RUNNER_TEMP/live2d-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert="$RUNNER_TEMP/enterprise.p12"
          profile="$RUNNER_TEMP/enterprise.mobileprovision"
          printf '%s' "$IOS_ENTERPRISE_P12_BASE64" | base64 --decode > "$cert"
          printf '%s' "$IOS_ENTERPRISE_PROFILE_BASE64" | base64 --decode > "$profile"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$IOS_ENTERPRISE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$IOS_SIGNING_IDENTITY"
          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          case "$profile_app_id" in *".${IOS_BUNDLE_ID}"|*".*") ;; *) echo "Provisioning profile does not cover ${IOS_BUNDLE_ID}"; exit 1 ;; esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          {
            echo "DEVELOPMENT_TEAM = ${IOS_TEAM_ID}"
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = ${IOS_SIGNING_IDENTITY}"
            echo "PROVISIONING_PROFILE = ${profile_uuid}"
          } >> App_Resources/iOS/build.xcconfig
      - name: Compile iPhone app without signing
        if: ${{ inputs.sign != true }}
        run: |
          set -euo pipefail
          project="$(find platforms/ios -name '*.xcodeproj' -type d -print -quit)"
          test -n "$project"
          xcodebuild -project "$project" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
      - name: Build enterprise-signed IPA
        if: ${{ inputs.sign == true }}
        run: npx --yes --package=nativescript@9.1.1 ns build ios --for-device --release --env.uglify
      - name: Upload IPA
        if: ${{ inputs.sign == true }}
        uses: actions/upload-artifact@v4
        with:
          name: live2d-native-ipa
          path: native-vue/platforms/ios/**/*.ipa
          if-no-files-found: error
